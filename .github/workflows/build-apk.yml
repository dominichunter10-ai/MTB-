name: Build Free Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Use fixed signing key (keeps Google sign-in working)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "::warning::debug.keystore not found in the repo"
          fi

      - name: Build web app and create Android project
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm run build
          npx cap add android
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "::warning::google-services.json not found, Google sign-in will not work"
          fi

      - name: Build APK
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: bash scripts/build-apk.sh

      - name: Upload HamsterleyMTB.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamsterleyMTB-APK
          path: dist-apk/HamsterleyMTB.apk
          retention-days: 30
